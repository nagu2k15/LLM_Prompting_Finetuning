
name: Python CI Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    name: quality-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest bandit pip-audit

      - name: Gate 1 - Lint
        run: ruff check .

      - name: Gate 2 - Formatting
        run: ruff format --check .

      - name: Gate 3 - Unit tests
        run: pytest -q

      - name: Gate 4 - Static security scan
        run: bandit -r app -ll

      - name: Gate 5 - Dependency vulnerability scan
        run: pip-audit
